name: Build and Publish Design Tokens

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tokens/**'
      - 'build-tokens.js'
      - 'package.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'tokens/**'
      - 'build-tokens.js'
      - 'package.json'

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@theholetruth-org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build design tokens
        run: npm run build
      
      - name: Prepare package for publishing
        run: |
          cd design-tokens || exit 1
          
          # Copy built tokens to package directory
          cp ../build/css/variables.css .
          cp ../build/scss/variables.scss .
          cp ../build/scss/variables-map.scss .
          cp ../build/json/tokens.json .
          
          # Copy LICENSE from root
          cp ../LICENSE .
      
      - name: Publish package to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd design-tokens || exit 1
          
          # Configure git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if there are any changes in the built tokens
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          
          git commit -m "Build design tokens" || exit 0
          
          # Determine version bump from commit message
          COMMIT_MSG=$(git log -2 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
            npm version major
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
            npm version minor
          else
            npm version patch
          fi
          
          # Publish to GitHub Packages
          npm publish
          
          # Push version update back to repository
          git reset --soft HEAD^1
          git add package.json
          git commit -m "Update package version [skip ci]" || exit 0
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
